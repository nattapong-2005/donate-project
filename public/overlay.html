<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Stream Alert Overlay</title>
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <!-- Sound effect element -->
  <audio id="alertAudio" src="/sounds/alert.mp3" preload="auto"></audio>

  <!-- Alert Container -->
  <div id="alertWrapper" class="alert-wrapper">
    <div class="alert-card">
      <div class="alert-shimmer"></div>
      
      <div class="alert-icon-wrap">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12"></polyline>
          <rect x="2" y="7" width="20" height="5"></rect>
          <line x1="12" y1="22" x2="12" y2="7"></line>
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
        </svg>
      </div>

      <div class="alert-title">
        <span id="donatorName" class="donator-name">ผู้สนับสนุน</span>
        <span style="font-weight: 500; font-size: 22px; color: #64748b;"> สนับสนุนแล้ว!</span>
      </div>

      <div>
        <div id="alertAmount" class="alert-amount-badge">+฿50.00</div>
      </div>

      <div id="alertMessage" class="alert-message"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
